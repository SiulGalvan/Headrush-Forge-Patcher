name: build
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  exe:
    needs: test
    strategy:
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --windowed --name mx5forge --paths mx5forge/vendor/mxedit
          --add-data "mx5forge/nam/blobs${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/nam/blobs"
          --add-data "mx5forge/art/assets${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/art/assets"
          --add-data "mx5forge/art/manifest_mx5_2.7.json${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/art"
          --add-data "mx5forge/vendor/mxedit${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/vendor/mxedit"
          mx5forge/__main__.py
      - uses: actions/upload-artifact@v4
        with: { name: "mx5forge-${{ matrix.os }}", path: dist/* }
