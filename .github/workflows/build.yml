name: build
on:
  push: { branches: [main], tags: ["v*"] }
  workflow_dispatch:
    inputs:
      rebuild_blobs:
        description: "Recompilar libnam_hook.so (Extended) desde nam_source_extended/ con la toolchain ARM"
        type: boolean
        default: true
env:
  # Toolchain Bootlin armv7-eabihf (prefijo arm-buildroot-linux-gnueabihf-). Debe ser compatible con
  # la glibc del firmware; cambia la URL si tu cadena habitual usa otra version.
  BOOTLIN_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--glibc--stable-2022.08-1.tar.bz2
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  blobs:
    if: ${{ inputs.rebuild_blobs != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain ARM (Bootlin)
        run: |
          mkdir -p "$HOME/tc"
          curl -fL "$BOOTLIN_URL" | tar -xj -C "$HOME/tc" --strip-components=1
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"
      - name: Preparar carpeta de compilacion
        run: |
          mkdir -p build/scripts build/patch build/blobs
          cp nam_source_extended/build_blobs_native.sh nam_source_extended/fetch_nam_core.sh build/scripts/
          cp nam_source_extended/nam_hook.cpp nam_source_extended/nam_preload.cpp nam_source_extended/trampoline_gonk.S build/patch/
      - name: Descargar NAM core + Eigen
        working-directory: build
        run: bash scripts/fetch_nam_core.sh
      - name: Compilar blobs
        working-directory: build
        run: |
          arm-buildroot-linux-gnueabihf-g++ --version
          bash scripts/build_blobs_native.sh
          file blobs/libnam_hook.so
      - uses: actions/upload-artifact@v4
        with:
          name: blobs-extended
          path: |
            build/blobs/libnam_hook.so
            build/blobs/libnam_preload.so
  exe:
    needs: [test, blobs]
    if: ${{ always() && needs.test.result == 'success' && (needs.blobs.result == 'success' || needs.blobs.result == 'skipped') }}
    strategy:
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Usar blobs recompilados (Extended)
        if: ${{ needs.blobs.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: blobs-extended
          path: mx5forge/nam/blobs/extended
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --windowed --name mx5forge --paths . --paths mx5forge/vendor/mxedit
          --add-data "mx5forge/nam/blobs${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/nam/blobs"
          --add-data "mx5forge/art/assets${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/art/assets"
          --add-data "mx5forge/art/manifest_mx5_2.7.json${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/art"
          --add-data "mx5forge/art/manifest_pedalboard_2.7.json${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/art"
          --add-data "mx5forge/vendor/mxedit${{ matrix.os == 'windows-latest' && ';' || ':' }}mx5forge/vendor/mxedit"
          packaging/entry.py
      - uses: actions/upload-artifact@v4
        with: { name: "mx5forge-${{ matrix.os }}", path: dist/* }
